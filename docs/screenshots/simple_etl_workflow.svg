<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
<rect width="1400" height="520" fill="#ffffff"/>
<text x="700" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#111827">Apache Airflow — Simple ETL Workflow</text>
<rect x="70" y="170" width="330" height="180" rx="24" fill="#f3f4f6" stroke="#374151" stroke-width="4"/>
<rect x="535" y="170" width="330" height="180" rx="24" fill="#f3f4f6" stroke="#374151" stroke-width="4"/>
<rect x="1000" y="170" width="330" height="180" rx="24" fill="#f3f4f6" stroke="#374151" stroke-width="4"/>
<text x="235" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#111827">EXTRACT</text>
<text x="235" y="285" text-anchor="middle" font-family="monospace" font-size="21" fill="#374151">Extracting data</text>
<text x="700" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#111827">TRANSFORM</text>
<text x="700" y="285" text-anchor="middle" font-family="monospace" font-size="21" fill="#374151">Transforming data</text>
<text x="1165" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#111827">LOAD</text>
<text x="1165" y="285" text-anchor="middle" font-family="monospace" font-size="21" fill="#374151">Loading data</text>
<line x1="400" y1="260" x2="535" y2="260" stroke="#374151" stroke-width="6"/>
<polygon points="535,260 510,245 510,275" fill="#374151"/>
<line x1="865" y1="260" x2="1000" y2="260" stroke="#374151" stroke-width="6"/>
<polygon points="1000,260 975,245 975,275" fill="#374151"/>
<text x="700" y="425" text-anchor="middle" font-family="monospace" font-size="25" fill="#111827">extract_task &gt;&gt; transform_task &gt;&gt; load_task</text>
</svg>